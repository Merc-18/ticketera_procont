# Local CLI preparation only: this file has NOT been pushed to Supabase.
# The local identifier does not authenticate the remote project name.
project_id = "ticketera-procont"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# User-reported catalog result: PostgreSQL 17.12 (170012), 2026-11-17.
# No CLI connection or remote SQL was executed by this agent.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Prepared only. Handler validates the bearer with Auth getUser and DB role RPCs.
# No bootstrap endpoint. Allows current asymmetric JWTs with explicit validation.
[functions.admin-users]
verify_jwt = false

# Independent client credentials and one-use entry codes are verified by the handler.
# Prepared only; no function deployment or remote configuration performed.
[functions.client-login]
verify_jwt = false
